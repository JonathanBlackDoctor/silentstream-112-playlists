<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="SilentStream 112호. 최근 30일의 수업 재생목록을 한곳에서.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'">
  <title>112호 · SilentStream</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="5"/><path d="m10 9 5 3-5 3Z"/></symbol>
  </svg>

  <section id="gate" class="gate" aria-labelledby="gate-title">
    <a class="brand gate-brand" href="./" aria-label="SilentStream 첫 화면"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span> SILENTSTREAM</a>
    <main class="gate-content">
      <span class="eyebrow">YOUR CLASS, REPLAYED.</span>
      <div class="room-number" aria-hidden="true">112<span>호</span></div>
      <h1 id="gate-title">수업 다시보기</h1>
      <p class="gate-description">비밀번호 네 자리를 입력해 주세요.</p>
      <form id="unlock-form">
        <label class="sr-only" for="pin">네 자리 비밀번호</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" minlength="4" required aria-describedby="pin-error" autofocus>
        <p id="pin-error" class="pin-error" role="status" aria-live="polite"></p>
        <button class="enter-button" type="submit"><span>들어가기</span><span aria-hidden="true">→</span></button>
      </form>
    </main>
    <footer class="gate-footer">A QUIET PLACE TO CATCH UP.</footer>
  </section>

  <div id="archive" class="archive" hidden>
    <header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span> SILENTSTREAM</a><button id="lock" class="lock-button"><svg><use href="#i-lock"/></svg>잠그기</button></header>
    <main class="page-main">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-top"><span class="room-badge"><span></span> ROOM 112</span><span class="eyebrow">CLASS ARCHIVE</span></div>
        <h1 id="page-title">놓친 수업도,<br><span>다시 차분하게.</span></h1>
        <p>최근 30일의 수업 재생목록을 한곳에서.</p>
      </section>
      <section class="collection" aria-labelledby="collection-title">
        <div class="collection-heading"><div><h2 id="collection-title">수업 재생목록</h2><span id="count" class="count">—</span></div><span id="range" class="range"></span></div>
        <div id="loading" class="empty" role="status">재생목록을 불러오고 있어요.</div>
        <div id="list" class="playlist-list"></div>
        <div class="collection-footer"><p id="update-status" role="status" aria-live="polite"></p><button id="refresh" class="text-button">새로고침 <span aria-hidden="true">↻</span></button></div>
      </section>
    </main>
    <footer class="page-footer"><span>SILENTSTREAM <span class="footer-dot">·</span> 112</span><span>수업이 없는 날은 표시되지 않아요.</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="copy-dialog" aria-labelledby="copy-title"><form method="dialog"><h2 id="copy-title">링크 직접 복사</h2><p>아래 링크를 길게 누르거나 선택해 복사해 주세요.</p><label class="sr-only" for="copy-url">재생목록 링크</label><input id="copy-url" readonly><button class="enter-button">닫기</button></form></dialog>
  <noscript>이 페이지를 이용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
