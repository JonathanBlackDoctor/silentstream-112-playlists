name: Update playlists and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate playlist rules
        run: npm test
      - name: Collect current playlists
        if: github.event_name != 'push'
        run: npm run sync
      - name: Save only changed playlist data
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          changed=false
          if ! git diff --quiet -- playlists.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add playlists.json
            git commit -m 'Update recent class playlists'
            git push origin HEAD:main
            changed=true
          fi
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" || "$changed" == "true" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Build static site
        if: steps.changes.outputs.deploy == 'true'
        run: npm run build
      - name: Upload site files
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.prepare.outputs.deploy == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
